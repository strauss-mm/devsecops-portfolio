name: Lab Validation

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/requirements.txt"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/requirements.txt"

permissions:
  contents: read

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check . --output-format=github

      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Find and install module requirements
        run: |
          find . -name "requirements.txt" -not -path "./.venv/*" -exec pip install -r {} \; 2>/dev/null || true

      - name: Run tests
        run: pytest --tb=short -q || true
