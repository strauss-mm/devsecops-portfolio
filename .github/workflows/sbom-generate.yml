name: SBOM Generation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom

      - name: Find and generate SBOMs
        run: |
          mkdir -p sbom-output
          find . -name "requirements.txt" -not -path "./.venv/*" | while read req; do
            module=$(dirname "$req" | sed 's|^\./||' | tr '/' '-')
            cyclonedx-py requirements -i "$req" -o "sbom-output/sbom-${module}.json" --format json || true
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom-output/

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-output/*.json
