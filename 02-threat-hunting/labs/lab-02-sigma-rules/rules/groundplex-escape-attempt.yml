title: Container Escape Attempt from Integration Platform
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: test
description: |
    Detects indicators of container escape attempts from within an
    integration platform worker container. Monitors for access to
    sensitive host paths, capability abuse, and namespace breakout patterns.
references:
    - https://attack.mitre.org/techniques/T1611/
author: Marna Marie Strauss
date: 2026/06/01
tags:
    - attack.privilege_escalation
    - attack.t1611
    - attack.container_escape
logsource:
    category: process_creation
    product: linux
detection:
    selection_docker_socket:
        CommandLine|contains:
            - "/var/run/docker.sock"
            - "docker.sock"
    selection_proc_mount:
        CommandLine|contains:
            - "/proc/1/root"
            - "/proc/self/exe"
            - "nsenter"
            - "unshare"
    selection_sensitive_mounts:
        CommandLine|contains:
            - "/host/"
            - "/var/log/host"
            - "mount -t proc"
            - "mount -t sysfs"
    selection_capability_abuse:
        CommandLine|contains:
            - "capsh --print"
            - "CAP_SYS_ADMIN"
            - "CAP_SYS_PTRACE"
            - "setns("
    condition: 1 of selection_*
falsepositives:
    - Container health check scripts accessing /proc
    - Legitimate monitoring agents (Datadog, Falco)
level: critical
