apiVersion: v1
kind: Pod
metadata:
  name: test-latest-tag
  namespace: app-team
spec:
  containers:
    - name: app
      image: nginx:latest
      # VIOLATION: using :latest tag
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          memory: "128Mi"
          cpu: "100m"
